<div class="card flex justify-center overflow-x-auto">
    <p-organization-chart [value]="data"  selectionMode="multiple" [(selection)]="selectedNodes" [collapsible]="true">
        <ng-template pTemplate="person" let-node>
            <div class="flex flex-col items-center p-2" style="align-items: center; display: flex; flex-direction: column; gap: 8px;">
                @if (node.data?.image) {
                    <img 
                        [src]="node.data.image" 
                        class="w-12 h-12 rounded-full border shadow" 
                        style="width: 48px; height: 48px; border-radius: 50%; object-fit: cover;" 
                        alt="avatar" 
                    />
                }
                <div class="font-bold text-sm" style="font-weight: bold; font-size: 14px; font-weight: bold;">
                    {{ node.label }}
                </div>
                
                @if (node.data?.sublabel) {
                    <div class="text-xs text-muted-color" style="font-size: 12px; color: #6c757d;">
                        {{ node.data.sublabel }}
                    </div>
                }
            </div>
        </ng-template>
    </p-organization-chart>
</div>
