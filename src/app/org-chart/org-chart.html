<div style="display: flex; gap: 20px; padding: 20px; height: 100vh;">
    <div style="width: 300px; border: 1px solid #ccc; display: flex; flex-direction: column; background: #fff;">
        <div style="display: flex; gap: 10px; padding: 10px; border-bottom: 1px solid #ccc; background: #f8f9fa;">
            <button (click)="addMember()" style="border: none; background: transparent; cursor: pointer; color: green; font-size: 18px; font-weight: bold;">＋</button>
            <button (click)="deleteMember()" style="border: none; background: transparent; cursor: pointer; color: red; font-size: 18px; font-weight: bold;">－</button>
            <button (click)="deleteMember()" style="border: none; background: transparent; cursor: pointer; color: red; font-size: 18px; font-weight: bold;">⬅️</button>
            <button (click)="deleteMember()" style="border: none; background: transparent; cursor: pointer; color: red; font-size: 18px; font-weight: bold;">➡️</button>
            <button (click)="moveUp($event)" style="border: none; background: transparent; cursor: pointer; color: red; font-size: 18px; font-weight: bold;">⬆️</button>
            <button (click)="moveDown($event)" style="border: none; background: transparent; cursor: pointer; color: red; font-size: 18px; font-weight: bold;">⬇️</button>
        </div>
        <div style="flex: 0.8; overflow-y: auto; padding: 5px;">
            <p-tree 
                [value]="data" 
                selectionMode="single" 
                [(selection)]="selectedMenuNode"
                (onNodeSelect)="onNodeSelect($event, false)"
                (onNodeUnselect)="onNodeUnselect()"
            >
                <ng-template let-node pTemplate="person" >
                    <span>{{ node.data?.name || '' }}</span>
                </ng-template>
            </p-tree>
        </div>
        <div>
            <p-drawer [(visible)]="isMenuOpen" position="right" header="Quản lý Thành Viên" 
                [style]="{'width': '350px'}" (onHide)="onDrawerHide()">
                <div class="flex flex-col gap-4 p-2" style="display: flex; flex-direction: column; gap: 16px;">
                    <div class="flex flex-col items-center gap-2" style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
                        <label class="font-bold text-sm" style="align-self: flex-start;">Ảnh đại diện:</label>
                        
                        <div (click)="fileInput.click()" 
                            style="width: 90px; height: 90px; border-radius: 50%; border: 2px dashed #ccc; display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; background: #f8f9fa; position: relative;">
                            
                            @if (editImage) {
                                <img [src]="editImage" style="width: 100%; height: 100%; object-fit: cover;" alt="Avatar" />
                            } @else {
                                <i class="pi pi-camera" style="font-size: 24px; color: #aaa;"></i>
                            }
                        </div>
                        <small style="color: #666; font-size: 11px;">Nhấp vào khung để tải ảnh lên</small>

                        <input #fileInput type="file" accept="image/*" (change)="onFileSelected($event)" style="display: none;" />
                    </div>
                    <div class="flex flex-col gap-2" style="display: flex; flex-direction: column; gap: 8px;">
                        <label class="font-bold text-sm">Tên thành viên:</label>
                        <input pInputText [(ngModel)]="editName" placeholder="Nhập tên..." style="padding: 8px; border: 1px solid #ccc; border-radius: 4px;"/>
                    </div>
                    <div class="flex flex-col gap-2" style="display: flex; flex-direction: column; gap: 8px;">
                        <label class="font-bold text-sm">Chức danh / Vùng:</label>
                        <input pInputText [(ngModel)]="editTitle" placeholder="Nhập chức danh..." style="padding: 8px; border: 1px solid #ccc; border-radius: 4px;"/>
                    </div>
                    <hr style="border: 0; border-top: 1px solid #dee2e6; margin: 8px 0;" />
                    <div class="flex flex-col gap-2" style="display: flex; flex-direction: column; gap: 10px;">
                        <p-button label="Save" icon="pi pi-check" severity="success" (onClick)="updateMember()" />
                    </div>
                </div>
            </p-drawer>
        </div>
    </div>
    <div style="flex: 1; border: 1px solid #ccc; overflow: auto; padding: 20px; background: #fafafa; display: flex; justify-content: center;">
        <p-organization-chart [value]="data"  selectionMode="multiple" [(selection)]="selectedNodes" [collapsible]="true" (onNodeSelect)="onNodeSelect($event, true)" >
            <ng-template pTemplate="person" let-node>
                <div class="flex flex-col items-center p-2" style="align-items: center; display: flex; flex-direction: column; gap: 8px; min-width: 250px">
                    @if (node.data?.image) {
                        <img 
                            [src]="node.data.image" 
                            class="w-12 h-12 rounded-full border shadow" 
                            style="width: 48px; height: 48px; border-radius: 50%; object-fit: cover;" 
                            alt="avatar" 
                        />
                    }
                    @if (node.data?.name) {
                        <div class="font-bold text-sm 111" style="font-weight: bold; font-size: 14px; font-weight: bold;">
                            {{ node.data.name }}
                        </div>
                    }
                    
                    @if (node.data?.title) {
                        <div class="text-xs text-muted-color 222" style="font-size: 12px; color: #6c757d;">
                            {{ node.data.title }}
                        </div>
                    }

                    <!-- <button (click)="createNode(node)">
                        Create
                    </button>
                    <button (click)="editNode(node)">
                        Edit
                    </button> -->
                    <!-- <button (click)="deleteNode(node)">
                        Delete
                    </button> -->
                </div>
            </ng-template>
        </p-organization-chart>
    </div>
</div>
